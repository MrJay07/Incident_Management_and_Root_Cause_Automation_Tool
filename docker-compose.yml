services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incidentdb
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://incident:incident@db:5432/incidentdb
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SENDER: alerts@incident-tool.local
      ALERT_RECIPIENT: devops@incident-tool.local
    ports:
      - "8000:8000"
    depends_on:
      - db
      - mailhog

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
